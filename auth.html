<!DOCTYPE html>
<html lang="en">
<head>
  <script src="db-sync.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYPER X – Join the Squad</title>
  <meta name="description" content="Create your secure HYPER X gaming account. Access premium gaming panels, mod menus and exclusive tools.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" href="db-sync.js" as="script">
  <style>
    :root {
      --red: #E50914;
      --red-dark: #B20710;
      --red-glow: rgba(229, 9, 20, 0.15);
      --bg: #0F0F0F;
      --bg2: #161616;
      --bg3: #1A1A1A;
      --card: #1A1A1A;
      --border: rgba(255, 255, 255, 0.08);
      --border-red: rgba(229, 9, 20, 0.25);
      --white: #ffffff;
      --gray: #A1A1AA;
      --green: #34d399;
      --font: 'Inter', sans-serif;
      --font-sub: 'Inter', sans-serif;
      --accent-grad: linear-gradient(135deg, #E50914 0%, #B20710 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      touch-action: manipulation;
    }

    body {
      font-family: var(--font);
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ===== ANIMATED BG ===== */
    .auth-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .auth-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(37,99,235,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(99,102,241,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 90% 50% at 50% 100%, rgba(0,0,0,0.8) 0%, transparent 70%);
    }

    .auth-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: orbFloat 15s ease-in-out infinite;
    }

    .bg-orb.orb1 {
      width: 400px; height: 400px;
      background: rgba(37,99,235,0.12);
      top: -10%; left: -5%;
      animation-delay: 0s;
    }

    .bg-orb.orb2 {
      width: 300px; height: 300px;
      background: rgba(99,102,241,0.08);
      bottom: -10%; right: -5%;
      animation-delay: -5s;
    }

    .bg-orb.orb3 {
      width: 200px; height: 200px;
      background: rgba(37,99,235,0.06);
      top: 50%; left: 60%;
      animation-delay: -10s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* ===== AUTH CARD ===== */
    .auth-card {
      position: relative;
      z-index: 10;
      background: rgba(17, 17, 26, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2.2rem 2rem;
      width: 100%;
      max-width: 420px;
      margin: 1rem;
      box-shadow: 
        0 0 60px rgba(0,0,0,0.6),
        0 0 100px rgba(255,0,51,0.06),
        inset 0 1px 0 rgba(255,255,255,0.04);
      animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== BRAND HEADER ===== */
    .brand-icon {
      width: 48px; height: 48px;
      background: var(--red);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 4px 20px var(--red-glow);
      position: relative;
    }

    .brand-icon::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255,0,51,0.5), transparent 60%);
      z-index: -1;
    }

    .brand-name {
      text-align: center;
      font-family: var(--font-sub);
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 3px;
      color: var(--red);
      margin-bottom: 0.2rem;
      text-transform: uppercase;
    }

    .auth-heading {
      text-align: center;
      font-family: var(--font-sub);
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--white);
      margin-bottom: 0.3rem;
      letter-spacing: 0.5px;
    }

    .auth-subtext {
      text-align: center;
      font-size: 0.88rem;
      color: var(--gray);
      margin-bottom: 2rem;
    }

    /* ===== FORM FIELDS ===== */
    .field-group {
      margin-bottom: 1rem;
    }

    .field-label {
      display: block;
      font-family: var(--font-sub);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      color: var(--white);
      margin-bottom: 0.45rem;
    }

    .field-label .optional {
      color: var(--gray);
      font-weight: 400;
      font-size: 0.78rem;
    }

    .field-input-wrap {
      position: relative;
    }

    .field-input-wrap .field-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
      width: 16px; height: 16px;
      pointer-events: none;
    }

    .field-input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem 0.85rem 2.6rem;
      color: var(--white);
      font-family: var(--font);
      font-size: 0.92rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .field-input::placeholder { color: rgba(136,136,160,0.6); }

    .field-input:focus {
      border-color: rgba(255,0,51,0.4);
      box-shadow: 0 0 0 3px rgba(255,0,51,0.08);
      background: rgba(26,26,36,0.9);
    }

    .field-input.no-icon {
      padding-left: 1rem;
    }

    /* Password toggle */
    .pwd-toggle {
      position: absolute;
      right: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gray);
      cursor: pointer;
      padding: 4px;
    }

    .pwd-toggle:hover { color: var(--white); }

    /* ===== TOS ===== */
    .tos-text {
      text-align: center;
      font-size: 0.78rem;
      color: var(--gray);
      margin: 1.2rem 0 1rem;
    }

    .tos-text a {
      color: var(--red);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* ===== SUBMIT BUTTON ===== */
    .btn-auth {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 10px;
      background: var(--red);
      color: var(--white);
      font-family: var(--font-sub);
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px var(--red-glow);
      margin-bottom: 1.2rem;
    }

    .btn-auth:hover {
      background: var(--red-dark);
      box-shadow: 0 6px 30px rgba(255,0,51,0.5);
      transform: translateY(-1px);
    }

    .btn-auth:active {
      transform: translateY(0);
    }

    /* ===== DIVIDER ===== */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .auth-divider span {
      font-family: var(--font-sub);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: var(--gray);
      text-transform: uppercase;
    }

    /* ===== GOOGLE BTN ===== */
    .btn-google {
      width: 100%;
      padding: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg3);
      color: var(--white);
      font-family: var(--font);
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      transition: all 0.2s;
      margin-bottom: 1.5rem;
    }

    .btn-google:hover {
      background: rgba(26,26,36,0.9);
      border-color: rgba(255,255,255,0.15);
    }

    .google-icon {
      width: 18px; height: 18px;
    }

    /* ===== SWITCH LINK ===== */
    .auth-switch {
      text-align: center;
      font-size: 0.88rem;
      color: var(--gray);
    }

    .auth-switch a {
      color: var(--red);
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.2s;
    }

    .auth-switch a:hover { color: #ff3355; text-decoration: underline; }

    /* ===== SIGNIN FIELDS (hidden by default) ===== */
    .signup-only { display: block; }
    .signin-only { display: none; }

    body.signin-mode .signup-only { display: none; }
    body.signin-mode .signin-only { display: block; }

    /* ===== SUCCESS MESSAGE ===== */
    .auth-success {
      display: none;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
      text-align: center;
      color: var(--green);
      font-weight: 600;
      font-size: 0.88rem;
      animation: fadeIn 0.3s ease;
    }

    .auth-error {
      display: none;
      background: rgba(255, 0, 51, 0.1);
      border: 1px solid rgba(255, 0, 51, 0.3);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
      text-align: center;
      color: #ff6b6b;
      font-weight: 600;
      font-size: 0.88rem;
      animation: shake 0.4s ease;
    }

    @keyframes fadeIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:translateY(0); } }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

    /* ===== GLOBAL VIDEO BACKGROUND ===== */
    .hero-video-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .bg-video-el {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      perspective: 1000px;
    }
    .bg-video-el.active {
      opacity: 1;
    }
    .hero-video-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 15, 0.45); /* 45% dark overlay for clear login form readability */
      z-index: 2;
    }

    /* Fix Button Text merging by defining explicit modes */
    .btn-auth span.signup-only { display: inline-block !important; }
    .btn-auth span.signin-only { display: none !important; }
    body.signin-mode .btn-auth span.signup-only { display: none !important; }
    body.signin-mode .btn-auth span.signin-only { display: inline-block !important; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .auth-card {
        margin: 0.5rem;
        padding: 2rem 1.5rem 1.5rem;
        border-radius: 16px;
      }
      .auth-heading { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- GLOBAL VIDEO BACKGROUND -->
  <div class="hero-video-container">
    <video id="neural-bg-video" class="bg-video-el active" autoplay loop muted playsinline preload="auto">
      <source src="assets/video/video_1781212813.mp4" type="video/mp4">
    </video>
    <div class="hero-video-overlay"></div>
  </div>

  <!-- AUTH CARD -->
  <div class="auth-card" id="auth-card">

    <!-- BRAND -->
    <div class="brand-icon">
      <svg viewBox="0 0 32 32" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 2 L4 7 L4 17 C4 23.5 9.2 28.8 16 30 C22.8 28.8 28 23.5 28 17 L28 7 Z" fill="rgba(255,255,255,0.15)"/>
        <path d="M17 8 L12.5 16 L16 16 L15 24 L19.5 16 L16 16 Z" fill="white"/>
      </svg>
    </div>

    <div class="brand-name">HYPER X</div>

    <h1 class="auth-heading signup-only">Join the Squad</h1>
    <h1 class="auth-heading signin-only">Welcome Back</h1>

    <p class="auth-subtext signup-only">Create your secure gaming account</p>
    <p class="auth-subtext signin-only">Sign in to your HYPER X account</p>

    <!-- STATUS MESSAGES -->
    <div class="auth-success" id="auth-success"></div>
    <div class="auth-error" id="auth-error"></div>

    <!-- AUTH FORM -->
    <form id="auth-form" autocomplete="off">

      <!-- Full Name (signup only) -->
      <div class="field-group signup-only">
        <label class="field-label">Full Name</label>
        <div class="field-input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" class="field-input" id="auth-name" placeholder="Your full name">
        </div>
      </div>

      <!-- Email (signup only) -->
      <div class="field-group signup-only">
        <label class="field-label">Email</label>
        <div class="field-input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" class="field-input" id="auth-email" placeholder="your@email.com">
        </div>
      </div>

      <!-- Username -->
      <div class="field-group">
        <label class="field-label">Username</label>
        <div class="field-input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.5 7.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0z"/><path d="M19.5 20.5c0-3.04-3.36-5.5-7.5-5.5s-7.5 2.46-7.5 5.5"/></svg>
          <input type="text" class="field-input" id="auth-username" placeholder="Choose a username" required>
        </div>
      </div>

      <!-- Password -->
      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="field-input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" class="field-input" id="auth-password" placeholder="••••••••" required>
          <button type="button" class="pwd-toggle" onclick="togglePwd()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Referral Code (signup only) -->
      <div class="field-group signup-only">
        <label class="field-label">Referral Code <span class="optional">(Optional)</span></label>
        <div class="field-input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.5 7.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0z"/><path d="M19.5 20.5c0-3.04-3.36-5.5-7.5-5.5s-7.5 2.46-7.5 5.5"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          <input type="text" class="field-input" id="auth-referral" placeholder="REF-XXXXX">
        </div>
      </div>

      <!-- TOS -->
      <p class="tos-text signup-only">By signing up, you agree to our <a href="terms.html">Terms of Service</a>.</p>

      <!-- SUBMIT -->
      <button type="submit" class="btn-auth" id="btn-auth">
        <span class="signup-only">Create Account</span>
        <span class="signin-only">Sign In</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="signup-only"><path d="M15.5 7.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0z"/><path d="M19.5 20.5c0-3.04-3.36-5.5-7.5-5.5s-7.5 2.46-7.5 5.5"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="signin-only"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      </button>
    </form>

    <!-- DIVIDER -->
    <div class="auth-divider"><span>or continue with</span></div>

    <!-- GOOGLE -->
    <button class="btn-google" onclick="alert('Google login coming soon!')">
      <svg class="google-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Register with Google
    </button>

    <!-- SWITCH -->
    <p class="auth-switch signup-only">
      Already have an account? <a onclick="toggleMode('signin')">Sign In</a>
    </p>
    <p class="auth-switch signin-only">
      Don't have an account? <a onclick="toggleMode('signup')">Sign Up</a>
    </p>

  </div>

  <script>
    // ===== ADMIN CREDENTIALS =====
    const ADMIN_USER = 'hyperm';

    function getAdminPassword() {
      const settings = JSON.parse(localStorage.getItem('paymentSettings') || '{}');
      return settings.adminPassword || 'hyperm2000';
    }

    // ===== MODE TOGGLE =====
    function toggleMode(mode) {
      const body = document.body;
      const card = document.getElementById('auth-card');
      hideMessages();

      if (mode === 'signin') {
        body.classList.add('signin-mode');
      } else {
        body.classList.remove('signin-mode');
      }

      // Re-trigger card animation
      card.style.animation = 'none';
      card.offsetHeight; // force reflow
      card.style.animation = 'cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1)';
    }

    // ===== PASSWORD TOGGLE =====
    function togglePwd() {
      const inp = document.getElementById('auth-password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    // ===== SHOW MESSAGES =====
    function showSuccess(msg) {
      const el = document.getElementById('auth-success');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('auth-error').style.display = 'none';
    }

    function showError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.style.display = 'block';
      // Re-trigger shake
      el.style.animation = 'none';
      el.offsetHeight;
      el.style.animation = 'shake 0.4s ease';
      document.getElementById('auth-success').style.display = 'none';
    }

    function hideMessages() {
      document.getElementById('auth-success').style.display = 'none';
      document.getElementById('auth-error').style.display = 'none';
    }

    // ===== FORM SUBMIT =====
    document.getElementById('auth-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const isSignIn = document.body.classList.contains('signin-mode');

      if (isSignIn) {
        handleSignIn();
      } else {
        handleSignUp();
      }
    });

    function handleSignIn() {
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value;

      if (!username || !password) { showError('Please fill all fields!'); return; }

      // Check if admin
      if (username.toLowerCase() === ADMIN_USER && password === getAdminPassword()) {
        localStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('currentUser', ADMIN_USER);
        showSuccess('✅ Admin login successful! Redirecting...');
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
        return;
      }

      // Check normal users
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const user = users.find(u =>
        (u.username.toLowerCase() === username.toLowerCase() || u.email?.toLowerCase() === username.toLowerCase()) &&
        u.password === password
      );

      if (user) {
        localStorage.setItem('currentUser', user.username);
        showSuccess(`✅ Welcome back, ${user.username}! Redirecting...`);
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      } else {
        showError('❌ Invalid username or password!');
      }
    }

    function handleSignUp() {
      const name     = document.getElementById('auth-name').value.trim();
      const email    = document.getElementById('auth-email').value.trim();
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value;
      const referral = document.getElementById('auth-referral').value.trim();

      if (!name || !email || !username || !password) {
        showError('Please fill all required fields!');
        return;
      }

      if (password.length < 4) {
        showError('Password must be at least 4 characters!');
        return;
      }

      let users = JSON.parse(localStorage.getItem('users') || '[]');

      // Check duplicates
      if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
        showError('Username already taken!');
        return;
      }
      if (users.some(u => u.email?.toLowerCase() === email.toLowerCase())) {
        showError('Email already registered!');
        return;
      }

      // Create user
      const newUser = {
        name,
        email,
        username,
        password,
        balance: 0,
        keysClaimed: 0,
        uid: 'HX-' + Math.floor(10000 + Math.random() * 90000),
        registryDate: new Date().toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }),
        avatar: '',
        referredBy: referral || ''
      };

      users.push(newUser);
      localStorage.setItem('users', JSON.stringify(users));
      localStorage.setItem('currentUser', username);

      // Handle referral bonus
      if (referral) {
        const refUser = users.find(u => u.uid === referral || u.username.toLowerCase() === referral.toLowerCase());
        if (refUser) {
          refUser.balance = (refUser.balance || 0) + 10;
          localStorage.setItem('users', JSON.stringify(users));
        }
      }

      showSuccess(`🎉 Account created! Welcome, ${username}!`);
      setTimeout(() => { window.location.href = 'index.html'; }, 1000);
    }

    // ===== AUTO-REDIRECT IF ALREADY LOGGED IN =====
    (function() {
      const currentUser = localStorage.getItem('currentUser');
      if (currentUser) {
        window.location.href = 'index.html';
      }
    })();

    // ===== CHECK URL PARAMS =====
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'signin') {
      toggleMode('signin');
    }
  </script>
  <script src="interactions.js" defer></script>
  <script src="bg-video-loader.js" defer></script>
</body>
