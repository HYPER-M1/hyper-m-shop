<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Futuristic HX Graphic -->
  <g transform="translate(15, 15)">
    <!-- H letter (left leg, crossbar, right leg) -->
    <path d="M 25 15 L 25 105" stroke="url(#cyberGrad)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)"/>
    <path d="M 25 60 L 65 60" stroke="url(#cyberGrad)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)"/>
    <path d="M 65 15 L 65 105" stroke="url(#cyberGrad)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)"/>
    
    <!-- X letter (crossing diagonal lines) -->
    <path d="M 85 15 L 145 105" stroke="url(#cyberGrad)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)"/>
    <path d="M 145 15 L 85 105" stroke="url(#cyberGrad)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)"/>
  </g>
  <!-- Text Styling -->
  <text x="185" y="82" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">
    HX<tspan fill="url(#cyberGrad)"> CLOTHES</tspan>
  </text>
  <text x="190" y="112" font-family="'Outfit', 'Inter', sans-serif" font-weight="500" font-size="18" fill="#a0aec0" letter-spacing="10">
    STREETWEAR
  </text>
</svg>
